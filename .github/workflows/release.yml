name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  # Weekly housekeeping only; every build job is gated off for this event.
  schedule:
    - cron: "17 4 * * MON"

# Least privilege at the workflow level; individual jobs raise it where needed.
permissions:
  contents: read

concurrency:
  # Scheduled housekeeping must not queue ahead of a real release on the default branch.
  group: release-${{ github.event_name == 'schedule' && 'housekeeping' || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve release tag
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # A pushed tag names the release; a manual run falls back to package.json. Both the
      # tag and the project version are validated here so a mismatch fails before any build.
      - name: Resolve tag from the pushed ref or package version
        id: resolve
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          tag=$(node --input-type=module -e '
            import fs from "node:fs/promises";
            const { resolveReleaseTag, assertTagMatchesVersion } = await import("./scripts/publish-release.mjs");
            const { version } = JSON.parse(await fs.readFile("package.json", "utf8"));
            const tag = resolveReleaseTag(process.env.GITHUB_REF_NAME, version);
            assertTagMatchesVersion(tag, version);
            console.log(tag);
          ')
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  # A tag can be pushed to any commit, so the release re-checks the source before building.
  verify:
    name: Typecheck and test
    if: ${{ github.event_name != 'schedule' }}
    needs: [version]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  windows:
    name: Windows installer and portable
    if: ${{ github.event_name != 'schedule' }}
    needs: [version, verify]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CBPANEL_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Windows release
        run: npm run release:windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cbpanel-release-windows
          path: |
            release/CBPanel-win-portable.zip
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  linux:
    name: Linux AppImage
    if: ${{ github.event_name != 'schedule' }}
    needs: [version, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CBPANEL_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install dependencies
        run: npm ci

      - name: Build Linux release
        run: npm run release:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cbpanel-release-linux-x64
          path: release/CBPanel-linux-x64.AppImage
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  macos:
    name: macOS DMG
    if: ${{ github.event_name != 'schedule' }}
    needs: [version, verify]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CBPANEL_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build macOS release
        run: npm run release:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cbpanel-release-macos
          path: release/CBPanel-macos-*.dmg
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    name: Publish versioned release
    if: ${{ github.event_name != 'schedule' }}
    needs: [version, verify, windows, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Download this run's release files
        uses: actions/download-artifact@v8
        with:
          pattern: cbpanel-release-*
          path: release-assets

      # The per-platform manifests generated during the build are discarded here: this step
      # writes the single release-wide manifest with the final asset digests.
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CBPANEL_RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: node scripts/publish-release.mjs release-assets

  cleanup:
    name: Remove temporary build transfers
    needs: [windows, linux, macos, publish]
    if: ${{ always() && github.event_name != 'schedule' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      # Artifacts are only a cross-runner handoff. Releases are the download entry.
      - name: Delete release build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          artifact_ids=$(gh api --paginate "repos/${GH_REPO}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("cbpanel-release-")) | .id')
          while IFS= read -r artifact_id; do
            [ -n "${artifact_id}" ] || continue
            gh api --method DELETE "repos/${GH_REPO}/actions/artifacts/${artifact_id}"
          done <<< "${artifact_ids}"

  prune-runs:
    name: Delete old workflow runs
    needs: [publish]
    # Runs after a successful release, and on the weekly schedule. Published releases are
    # never removed by this; it prunes workflow runs, logs and their artifacts only.
    if: ${{ always() && (github.event_name == 'schedule' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Delete workflow runs older than 10 days
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 10
          keep_minimum_runs: 3
