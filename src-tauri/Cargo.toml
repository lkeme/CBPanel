[package]
name = "cbpanel"
version = "1.0.20"
description = "CBPanel desktop shell"
authors = ["CBPanel"]
edition = "2021"
rust-version = "1.90.0"

[lib]
name = "cbpanel_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-shell = "2.6.0"
tauri-plugin-single-instance = "2.5.5"
uuid = { version = "1.29.3", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# Keep these aligned with Tauri 2.12.7's COM interface types.
webview2-com = "0.39.1"
windows-core = "0.62.2"
