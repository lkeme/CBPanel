[package]
name = "cbpanel"
version = "0.1.0"
description = "CBPanel desktop shell"
authors = ["CBPanel"]
edition = "2021"
rust-version = "1.90.0"

[lib]
name = "cbpanel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-shell = "2.5.0"
tauri-plugin-single-instance = "2.5.3"
uuid = { version = "1.28.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# Keep these aligned with Tauri 2.12.3's COM interface types.
webview2-com = "0.39.1"
windows-core = "0.62.2"
